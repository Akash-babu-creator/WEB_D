<!DOCTYPE html>
<html>

<head>
    <title>google</title>
    <style>
        div{
            text-align: center;
        }
        .input-google-search {
            border: none;
            font-size: 25px;
            width: 500px;
            padding-top: 12px;
            padding-bottom: 12px;
            padding-left: 25px;
            padding-right: 280px;
            border-radius: 26px;
            box-shadow: 3px 3px 14px rgba(0, 0, 0, 0.15);
            margin-bottom: 50px;
        }  
        .Google-logo {
            margin-bottom: 10px;
        }
        .search-button-div,.feeling-div{
            display: inline-block;
        }
        .search-button-div{
            margin-right: 10px;
        }
        .google-search-button,.feeling-lucky-button{
            background-color: rgb(249, 249, 249);
            padding-top: 12px;
            padding-bottom: 12px;
            padding-left: 22px;
            padding-right: 22px;
            font-size: 18px;
            border: none;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="google">
        <div>
            <img class="Google-logo" src="download.png">
        </div>
        <div>
            <input class="input-google-search" type="text" placeholder="Search Google or type a URL">
        </div>
        <div class="search-button-div"> 
            <button class="google-search-button">Google search</button>
        </div>
        <div class="feeling-div">
            <button class="feeling-lucky-button">I'm Feeling Lucky</button>
        </div>

    </div>
</body>

</html>
