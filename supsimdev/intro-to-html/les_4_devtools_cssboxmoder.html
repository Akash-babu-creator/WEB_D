<!DOCTYPE html>
<html>
    <head>
        <style>
    /* USING PADDING INSTEAD OF HEIGHT AND WIDTH */
    .subscribe-button{
        background: rgb(200, 1, 1);
        color:white;
        border: none;
        border-radius:2px;
        cursor:pointer;
        /* cursor:progress' */
        margin-right: 10px;
       
        padding-top:10px;
        padding-bottom:10px;
        padding-left:16px;
        padding-right:16px;
        transition: opacity 0.15s;
        vertical-align: top;
    }
    .subscribe-button:hover{
        opacity: 0.8;         /*it tells us how see through an html element is. it's value is between 0 and 1*/
    }
    .subscribe-button:active{
        opacity: 0.5;
    }
    .join_button{
        background-color: white;
        border: solid;
        border-color: rgb(54, 114, 216);
        border-style: solid;
        border-width: 1px;
        color: rgb(51, 107, 190);
        padding-top:9px;
        padding-bottom:9px;
        padding-left:16px;
        padding-right:16px;
        border-radius : 2px;
        cursor: pointer;
        /* margin-right: 10px; */
        transition: background-color 0.15s,color 0.15s;
        vertical-align: top;

    }
    .join_button:hover{
        background-color: rgb(54,114,216);
        color: white;
    }
    .join_button:active{
        opacity :0.7;
    }
    .tweet-button{
        background-color: rgb(2, 158, 255);
        color: white;
        border: none;
        padding-top:10px;
        padding-bottom:10px;
        padding-left:16px;
        padding-right:16px;
        border-radius: 18px;
        font-weight: bold;
        font-size:15px;
        cursor: pointer;
        margin-left: 10px;
        transition:box-shadow 0.15s;
        vertical-align: top;
        

    }
    .tweet-button:hover{
        box-shadow: 5px 5px 10px rgba(0,0,0,0.15);
    }
    
</style>

    </head>
    <body>
        <button class="subscribe-button">
    SUBSCIRBE
</button>
<button class="join_button">
    JOIN
</button>
<button class="tweet-button">
    Tweet
</button>
    </body>
</html>
