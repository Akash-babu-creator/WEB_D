<!DOCTYPE html>
<html>
    <head>
        <title>exercise-7</title>
        <style>
            .parrot_image{
                border-radius:100px;
                width: 200px;
                height: 200px;
                object-fit: cover;
                object-position: center;
                margin-bottom:100px;
            }
            .email{
                font-family: arial;
                color: rgb(92, 91, 91);
                margin-bottom:6px;
            }
            .input-email{
                margin-top: 0;
                width: 320px;
                height: 30px;
                border-style: solid;
                border-radius: 3px;
            }
            .terms-condition{
                font-family: arial;
                color:rgb(92, 91, 91) ;
                font-size: 13px;
                /* font-weight: bold; */
            }
            .join-button{
                background-color: rgb(34, 152, 248);
                color: white;
                font-size: 15px;
                font-weight: bold;
                padding-top:15px;
                padding-bottom: 15px;
                padding-left: 118px;
                padding-right: 119px;
                border-radius:26px;
                border:none;
                margin-left: 0;
            }
            .search-bar{
                font-size: 16px;
                /* color: rgb(190, 188, 188); */
                font-weight: bold;
                color: rgb(206, 204, 204);
                padding-top: 12px;
                padding-bottom: 12px;
                border-radius: 7px;
                border-color:rgb(207, 207, 207);
                border-style: solid;
                border-width: 1px;
                padding-left: 14px;
            }
            .tweet-img{
                width: 60px;
                height: 60px;
                object-fit: cover;
                object-position: center;
                border-radius: 30px;
                vertical-align: middle;
            }
            .question{
                border: none;
                vertical-align: middle;
                padding-left: 15px;
                font-size: 20px;
                padding-right: 130px;
            }
            .tweet-button{
                color: white;
                font-weight: bold;
                background-color: rgb(57, 161, 245);
                font-size: 20px;
                border:none;
                padding-top: 13px;
                padding-bottom: 13px;
                padding-left: 26px;
                padding-right: 26px;
                border-radius: 25px;
            }
        </style>
    </head>
    <body>
        <img class="parrot_image" src="download.jpg">
        <!-- linked in signup -->
        <p class="email">Email</p>
        <input class="input-email" type="text">
        <p class="terms-condition">By clicking Agree & Join, you agree to the Privacy Policy</p>
        <button class="join-button">Agree & Join</button>
        <br>
        <br>
        <br>
        <input class ="search-bar" type="text" placeholder="Search">
        <br>
        <br>
        
        <img class="tweet-img" src="download.jpg" ><input class="question" type="text" placeholder="What's happening?">
        <button class="tweet-button">Tweet</button>
        
    </body>


</html>
