<!DOCTYPE html>
<html>
    <head>
        <title>exercise-8</title>
        <style>
            .input-block,.input-email{
                display: block;
                border-width: 1px;
                border-style: solid;
                border-radius: 2px;
                padding-right: 0;
                border-color: rgb(163, 162, 162);
                color: gray;
            }
            .input-block{
                margin-bottom: 6px;
            }
            .thnx-para{
                display: inline-block;
                font-size: 18px;
                width: 220px;
                vertical-align: middle;
            }
            .yes-button{
                margin-left: 14px;
            }
            .Google-logo{
                display: block;
                margin-left: 250px;
                margin-bottom: 10px;

            }
            .input-google-search{
                border: none;
                font-size: 25px;
                width: 500px;
                padding-top:12px;
                padding-bottom:12px;
                padding-left: 25px;
                padding-right: 280px;
                margin-left: 40px;
                border-radius: 26px;
                box-shadow: 3px 3px 14px rgba(0,0,0,0.15);;
            }
        </style>
    </head>
    <body>
        <input class="input-block" type="text" placeholder="Name">
        <input class="input-email" type="text" placeholder="Email">
        <p class="thnx-para">
            Thanks for chatting with our customer support. Would you like to take our quick survery?
        </p>
        <button class ="yes-button"> Yes</button>
        <button class="no-button">No</button>
        <img class="Google-logo" src="download.png">
        <input class="input-google-search" type="text" placeholder="Search Google or type a URL">
    </body>
    
</html>
