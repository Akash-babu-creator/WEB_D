<!DOCTYPE html>
<html>
    <head>
        <style>
            .frstname-input,.lastname-input,.email-input{
                color: rgb(118, 118, 118);
                border-width: 1px;
                border-color: rgb(191, 189, 189);
                border-style: solid;
                padding-left: 12px;
                padding-top: 12px;
                padding-bottom: 12px;
                border-radius: 4px;
                font-family: arial;
            }
            .email-input{
                display: block;
                margin-top: 10px;
                margin-bottom: 12px;
                padding-right: 192px;
            }
            .signup-button{
                /* text-align: center; */
                padding-left: 163px;
                padding-right: 163px;
                padding-top: 12px;
                padding-bottom: 12px;
                border:none;
                color: white;
                background-color: blue;
                border-radius: 7px;
                font-weight: bold;
            }
            .inpt-pickup,.inpt-destination{
                display: block;
                border:none;
                background-color: rgb(246, 242, 242);
                padding-top: 12px;
                padding-bottom: 12px;
                padding-left: 16px;
                padding-right: 180px;
            }
            .inpt-destination{
                margin-bottom: 30px;
                margin-top: 10px;  
            }
            .request-button{
                background-color: black;
                color: white;
                border: none;
                padding-top: 12px;
                padding-bottom: 12px;
                padding-left: 20px;
                padding-right: 20px;
                cursor: pointer;
                margin-right: 20px;
            }
            .later-button{
                background-color: rgb(246, 242, 242);
                border: none;
                padding-top: 12px;
                padding-bottom: 12px;
                padding-left: 20px;
                padding-right: 20px;
                font-family: Arial, Helvetica, sans-serif;
            }
        </style>
    </head>
    <body>
        <input class="frstname-input" type="text" placeholder="First name">
        <input class="lastname-input" type="text" placeholder="Last name">
        <input class="email-input" type="text" placeholder="Email">
        <button class="signup-button">Sign Up</button>
        <P>
            <h3>Request a ride now</h3>
            <input  class="inpt-pickup" type="text" placeholder="Enter pickup location">
            <input class="inpt-destination" type="text"placeholder="Enter destination">
            <button class="request-button" >Request now</button>
            <button class="later-button"> Schedule for later</button>
        </P>
    </body>
</html>
