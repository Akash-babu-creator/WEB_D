<!DOCTYPE html>
<html>

<head>
    <title>YouTube.com Clone</title>
    <style>
        .thumbnails {
            width: 300px;
            display: block;
        }

        .search-bar {
            font-size: 15px;
            display: block;
        }

        .video-title {
            width: 300px;
        }

        .video-preview {
            width: 300px;
            display: inline-block;
            vertical-align: top;
            margin-right: 15px;
        }
    </style>


</head>

<body>
    <input class="search-bar" type="text" placeholder="Search"> 
    <div class="video-preview">
        <img class="thumbnails" src="thumbnails/thumbnail-1.webp" alt="">
        <p class="video-title">
            Talking Tech and AI wiith Google CEO Sundar Pichai!
        </p>
        <p class="video-author">Marques Brownlee</p>
        <p class="video-stats">3.4M views &#183; 6 months ago </p>
    </div>
     <div class="video-preview">
        <img class="thumbnails" src="thumbnails/thumbnail-2.webp" alt="">
        <p class="video-title">
            Try Not To Laugh challange#9
        </p>
        <p class="video-author">Markiplier</p>
        <p class="video-stats">19M views &#183; 4 years ago</p>
    </div>
</body>

</html>
